services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: adel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adel -d homework"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=homework;Username=adel;Password=${POSTGRES_PASSWORD:-1234}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
